spring.application.name=chess-move-reader-api
server.port=${SERVER_PORT:8000}

# --- Datasource / JPA / Flyway -----------------------------------------------
# JDBC form (Java), not the postgresql+psycopg:// form the old Python backend used.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chess_move_reader}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:chess}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:chess}

# Flyway owns the schema -- Hibernate only validates it matches, never auto-generates
# DDL. Migrations live in src/main/resources/db/migration/ (empty for now; see
# docs/backend-java-architecture.md for the planned schema).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- File uploads (scoresheet images) -----------------------------------------
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_MB:10}MB
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_MB:10}MB

# --- App-specific config (bind via @ConfigurationProperties once implemented) --
# Scoresheet image storage -- filesystem + Docker volume, same approach as the
# retired Python backend (see docs/backend-java-architecture.md).
app.storage.dir=${STORAGE_DIR:./data/uploads}

# OCR provider selection -- "mock" (fixed fixture, no API key needed) or "http"
# (delegates to apps/ocr, the Python/Claude-vision microservice). Same two-value
# convention as the retired Python backend's OCR_CLIENT for muscle-memory.
app.ocr.client=${OCR_CLIENT:mock}
app.ocr.service-url=${OCR_SERVICE_URL:http://localhost:8001}

# CORS -- comma-separated (the Python backend used a JSON-array string; Java uses
# Spring's relaxed List<String> binding instead, simpler to configure via env var).
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}

# JWT signing secret -- MUST be overridden outside local/throwaway dev. The default
# below is intentionally obvious filler, not a real secret.
app.jwt.secret=${JWT_SECRET:CHANGE_ME_this_is_not_a_real_secret_replace_me}
app.jwt.access-token-ttl-minutes=${JWT_ACCESS_TOKEN_TTL_MINUTES:60}

# --- Actuator / OpenAPI --------------------------------------------------------
management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html
